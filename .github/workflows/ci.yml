name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs, not tags. Tags can be moved: in March 2026 an attacker
      # force-pushed malware onto most trivy-action tags. Dependabot (.github/dependabot.yml) bumps these.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.17"

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2

      - name: Format
        run: make fmt-check

      - name: Validate
        run: make validate

      - name: Lint
        run: make lint
        env:
          # Avoids GitHub API rate limits when tflint downloads the aws ruleset.
          GITHUB_TOKEN: ${{ github.token }}

      - name: Security scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: terraform
          severity: HIGH,CRITICAL
          exit-code: "1"

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controlplane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: controlplane/go.mod
      - name: Vet and test
        run: |
          go vet ./...
          go test -race ./...
